services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emaus
      POSTGRES_USER: emaus
      POSTGRES_PASSWORD: emaus-local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emaus -d emaus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
