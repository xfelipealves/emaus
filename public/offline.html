<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sem conexão · Emaús</title>
<style>
  :root{color-scheme:light dark;--bg:#fbf9f6;--fg:#2a211c;--muted:#7a6d64;--p:#b9532a}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1714;--fg:#f1ece6;--muted:#a89a8f;--p:#e08a5c}}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:24px}
  main{max-width:22rem;text-align:center}
  h1{font:400 2.2rem/1.1 Georgia,serif;margin:16px 0 8px}
  p{color:var(--muted);margin:0 0 20px}
  button{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icon.svg" width="56" height="56" alt="">
  <h1>Sem conexão</h1>
  <p>O Emaús precisa de internet para mostrar os dados da igreja. Assim que a conexão voltar, é só tentar de novo.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</main>
</body>
</html>
